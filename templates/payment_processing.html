{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-white flex items-center justify-center">
    <div class="text-center space-y-6">
        <div class="w-16 h-16 border-4 border-gold border-t-transparent rounded-full animate-spin mx-auto"></div>
        <h2 class="text-2xl font-serif text-onyx">Securing Your Payment...</h2>
        <p class="text-gray-400 text-sm uppercase tracking-widest">Please do not refresh or close this window</p>
        
        <div class="pt-10 flex flex-col items-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/UPI-Logo-vector.svg" class="h-8 opacity-50 mb-4">
            <p class="text-[10px] text-gray-300">🔒 PCI-DSS Compliant Encryption</p>
        </div>
    </div>
</div>

<script>
    // 3 second baad automatic SUCCESS PAGE par bhej do
    setTimeout(function() {
        window.location.href = "{% url 'order_success_page' order.order_id %}";
    }, 3000);
</script>
{% endblock %}

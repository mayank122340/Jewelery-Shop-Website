{% extends 'dashboard_base.html' %}

{% block admin_content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-100 mt-10">
    <h2 class="text-2xl font-serif text-onyx mb-6">Create Sub-Admin</h2>
    
    {% if messages %}
    {% for message in messages %}
        <div class="p-4 mb-4 text-sm rounded-lg {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label class="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Full Name</label>
            <input type="text" name="name" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 mt-1 focus:border-gold outline-none">
        </div>

        <div>
            <label class="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Email (Login ID)</label>
            <input type="email" name="email" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 mt-1 focus:border-gold outline-none">
        </div>

        <div>
            <label class="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Password</label>
            <input type="text" name="password" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 mt-1 focus:border-gold outline-none">
        </div>

        <button type="submit" class="w-full bg-gold text-white py-4 rounded-xl font-bold uppercase tracking-widest hover:bg-onyx transition-all shadow-lg mt-4">
            Create Access
        </button>
    </form>
</div>
{% endblock %}

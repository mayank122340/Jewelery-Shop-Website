{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-[#0D0D0D] flex items-center justify-center py-20 px-4">
    <div class="bg-[#1A1A1A] w-full max-w-md rounded-[40px] border border-gold/20 p-10 text-center">
        <h2 class="text-3xl font-serif text-gold mb-6">Reset Password</h2>
        <p class="text-gray-400 text-xs mb-8">Apna email dalein, hum aapko reset link bhejenge.</p>
        
        <form method="POST" class="space-y-6 text-left">
            {% csrf_token %}
            <div class="space-y-2">
                <label class="text-[9px] uppercase tracking-widest text-gray-500 ml-2">Email Address</label>
                <input type="email" name="email" required class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-gold outline-none transition-all">
            </div>
            <button type="submit" class="w-full py-4 bg-gold text-onyx font-bold uppercase tracking-[0.2em] rounded-xl hover:bg-white transition-all duration-500 shadow-lg">
                Send Reset Link 📧
            </button>
        </form>
    </div>
</div>
{% endblock %}

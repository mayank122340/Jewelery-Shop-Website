{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-[#0D0D0D] flex items-center justify-center py-20 px-4">
    
    <div class="bg-[#1A1A1A] w-full max-w-md rounded-[40px] border border-gold/20 shadow-[0_0_50px_rgba(212,175,55,0.1)] overflow-hidden relative">
        
        <div class="flex border-b border-white/5">
            <button onclick="showLogin()" id="tab-login" class="w-1/2 py-6 text-[10px] uppercase tracking-[0.3em] font-bold text-gold bg-white/5">Sign In</button>
            <button onclick="showSignup()" id="tab-signup" class="w-1/2 py-6 text-[10px] uppercase tracking-[0.3em] font-bold text-gray-500 hover:text-white transition">Create Account</button>
        </div>

        <div class="p-10">
            {% if error %}
            <div class="mb-6 bg-red-500/10 border border-red-500/50 p-4 rounded-xl text-red-400 text-xs text-center">
                {{ error }}
            </div>
            {% endif %}

            <form id="login-form" method="POST" action="{% url 'login_page' %}" class="space-y-6">
                {% csrf_token %}
                <div class="space-y-2">
                    <label class="text-[9px] uppercase tracking-widest text-gray-500">Email Address</label>
                    <input type="email" name="email" required class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-gold outline-none transition-all">
                </div>
                <div class="space-y-2">
                    <label class="text-[9px] uppercase tracking-widest text-gray-500">Password</label>
                    <input type="password" name="password" required class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-gold outline-none transition-all">
                </div>
                <button type="submit" class="w-full py-4 bg-gold text-onyx font-bold uppercase tracking-[0.2em] rounded-xl hover:bg-white transition-all duration-500 mt-4 shadow-lg">
                    Access Account
                </button>
                <div class="text-center pt-4">
                    <a href="#" class="text-[9px] text-gray-600 hover:text-gold transition">Forgot Password?</a>
                </div>
            </form>

            <div id="signup-form" class="hidden">
                <form method="POST" action="{% url 'create_account' %}" id="final-signup-form">
                    {% csrf_token %}
                    
                    <div id="step-1" class="space-y-6">
                        <div class="space-y-2">
                            <label class="text-[9px] uppercase tracking-widest text-gray-500">Email Address</label>
                            <input type="email" id="signup-email" name="email" required class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-gold outline-none">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[9px] uppercase tracking-widest text-gray-500">Mobile Number</label>
                            <input type="text" name="mobile" required class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-gold outline-none">
                        </div>
                        <button type="button" onclick="sendOTP()" id="btn-send-otp" class="w-full py-4 bg-white/10 text-white font-bold uppercase tracking-[0.2em] rounded-xl hover:bg-gold hover:text-onyx transition-all duration-500 mt-4">
                            Send OTP Verification
                        </button>
                    </div>

                    <div id="step-2" class="hidden space-y-6 text-center">
                        <p class="text-xs text-gray-400">OTP sent to <span id="display-email" class="text-white"></span></p>
                        <input type="text" id="otp-input" placeholder="Enter 6-digit Code" class="w-full text-center bg-black/50 border border-white/10 rounded-xl px-4 py-4 text-2xl tracking-[0.5em] text-gold focus:border-gold outline-none">
                        
                        <div class="flex justify-between items-center text-[10px] text-gray-500">
                            <span id="timer">02:00</span>
                            <button type="button" onclick="resendOTP()" id="btn-resend" class="text-gray-600 cursor-not-allowed" disabled>Resend OTP</button>
                        </div>

                        <button type="button" onclick="verifyOTP()" class="w-full py-4 bg-gold text-onyx font-bold uppercase tracking-[0.2em] rounded-xl hover:bg-white transition-all mt-4">
                            Verify & Proceed
                        </button>
                        <p id="otp-error" class="text-red-500 text-xs hidden mt-2"></p>
                    </div>

                    <div id="step-3" class="hidden space-y-6">
                        <div class="space-y-2">
                            <label class="text-[9px] uppercase tracking-widest text-gray-500">Create Password</label>
                            <input type="password" name="password" required class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-gold outline-none">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[9px] uppercase tracking-widest text-gray-500">Confirm Password</label>
                            <input type="password" name="confirm_password" required class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-gold outline-none">
                        </div>
                        <button type="submit" class="w-full py-4 bg-gold text-onyx font-bold uppercase tracking-[0.2em] rounded-xl hover:bg-white transition-all duration-500 mt-4 shadow-lg">
                            Complete Registration
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

<script>
    // --- UI TOGGLE LOGIC ---
    function showLogin() {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('signup-form').classList.add('hidden');
        document.getElementById('tab-login').classList.add('text-gold', 'bg-white/5');
        document.getElementById('tab-signup').classList.remove('text-gold', 'bg-white/5');
        document.getElementById('tab-signup').classList.add('text-gray-500');
    }

    function showSignup() {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('signup-form').classList.remove('hidden');
        document.getElementById('tab-signup').classList.add('text-gold', 'bg-white/5');
        document.getElementById('tab-login').classList.remove('text-gold', 'bg-white/5');
        document.getElementById('tab-login').classList.add('text-gray-500');
    }

    // --- OTP LOGIC ---
    let timerInterval;

    function startTimer() {
        let duration = 120; // 2 minutes
        const display = document.getElementById('timer');
        const resendBtn = document.getElementById('btn-resend');
        
        clearInterval(timerInterval);
        resendBtn.disabled = true;
        resendBtn.classList.add('text-gray-600', 'cursor-not-allowed');
        resendBtn.classList.remove('text-gold');

        timerInterval = setInterval(() => {
            let minutes = parseInt(duration / 60, 10);
            let seconds = parseInt(duration % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            display.textContent = minutes + ":" + seconds;

            if (--duration < 0) {
                clearInterval(timerInterval);
                display.textContent = "00:00";
                resendBtn.disabled = false;
                resendBtn.classList.remove('text-gray-600', 'cursor-not-allowed');
                resendBtn.classList.add('text-gold', 'hover:underline');
            }
        }, 1000);
    }

    function sendOTP() {
        const email = document.getElementById('signup-email').value;
        if(!email) { alert("Please enter email first"); return; }

        const btn = document.getElementById('btn-send-otp');
        btn.innerHTML = "Sending...";
        btn.disabled = true;

        fetch(`/auth/send-otp/?email=${email}`)
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');
                document.getElementById('display-email').innerText = email;
                startTimer();
            } else {
                alert("Error sending OTP");
                btn.innerHTML = "Send OTP Verification";
                btn.disabled = false;
            }
        });
    }

    function verifyOTP() {
        const email = document.getElementById('signup-email').value;
        const otp = document.getElementById('otp-input').value;
        const errorMsg = document.getElementById('otp-error');

        fetch(`/auth/verify-otp/?email=${email}&otp=${otp}`)
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById('step-2').classList.add('hidden');
                document.getElementById('step-3').classList.remove('hidden');
            } else {
                errorMsg.innerText = data.message;
                errorMsg.classList.remove('hidden');
            }
        });
    }

    function resendOTP() {
        sendOTP();
    }
</script>
{% endblock %}
